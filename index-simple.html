<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD6AE">
<title>The Vita Pool</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#FFF8F0}
body{height:100dvh;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#4A3428}

/* iframe เต็มจอ ไม่มีขอบ ไม่มี scrollbar */
#app{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;border:0;margin:0;padding:0;display:block;opacity:0;transition:opacity .5s ease}
#app.ready{opacity:1}

/* Loading screen */
#loader{position:fixed;inset:0;z-index:10;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#FFF8F0;transition:opacity .5s ease,visibility .5s ease}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
#loader b{font-size:30px;letter-spacing:.02em}
.spin{width:44px;height:44px;border:4px solid #F2CBA5;border-top-color:#E89A62;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loader" role="status" aria-live="polite">
  <div class="spin" aria-hidden="true"></div>
  <b>The Vita Pool</b>
</div>

<iframe id="app" title="The Vita Pool" allow="fullscreen" allowfullscreen scrolling="no" frameborder="0"></iframe>

<script>
(function () {
  var URL_ = 'https://script.google.com/macros/s/AKfycby1pR8aKVIVbDDDEYR077YDvGv0rTH7SbjiQmbuU2HXx_K9P6x4zxZd23an9n6UfrjTIw/exec';
  var frame = document.getElementById('app'), loader = document.getElementById('loader'), done = false;
  function finish() {
    if (done) return; done = true;
    frame.classList.add('ready');
    loader.classList.add('hide');
    setTimeout(function () { loader.style.display = 'none'; }, 600);
  }
  frame.addEventListener('load', finish);
  frame.src = URL_ + (location.search || '');
  setTimeout(finish, 20000); // กันค้าง
})();
</script>
<noscript>กรุณาเปิดใช้งาน JavaScript</noscript>
</body>
</html>
