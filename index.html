<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a2a43">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>The Vita Pool</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;           /* ไม่มี scrollbar ของหน้าหลัก */
      background: #0a2a43;
    }

    /* iframe เต็มจอ ไม่มีขอบ */
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;              /* fallback */
      height: 100dvh;             /* กัน address bar บนมือถือบัง */
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #fff;
    }

    /* Loading screen */
    #loader {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: linear-gradient(160deg, #0a2a43 0%, #0e5a8a 55%, #19a7c9 100%);
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", "Sarabun", sans-serif;
      opacity: 1;
      transition: opacity .6s ease, visibility .6s ease;
    }
    #loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .brand {
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 700;
      letter-spacing: .04em;
    }
    .sub {
      font-size: .95rem;
      opacity: .75;
      margin-top: -12px;
    }

    /* คลื่นน้ำ */
    .waves {
      display: flex;
      gap: 7px;
      height: 36px;
      align-items: flex-end;
    }
    .waves span {
      width: 8px;
      height: 14px;
      border-radius: 4px;
      background: #fff;
      animation: wave 1.1s ease-in-out infinite;
    }
    .waves span:nth-child(2) { animation-delay: .12s; }
    .waves span:nth-child(3) { animation-delay: .24s; }
    .waves span:nth-child(4) { animation-delay: .36s; }
    .waves span:nth-child(5) { animation-delay: .48s; }

    @keyframes wave {
      0%, 100% { height: 14px; opacity: .55; }
      50%      { height: 36px; opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .waves span { animation: none; }
      #loader { transition: none; }
    }
  </style>
</head>
<body>

  <div id="loader" role="status" aria-live="polite">
    <div class="brand">The Vita Pool</div>
    <div class="waves" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="sub">กำลังโหลด...</div>
  </div>

  <iframe
    id="app"
    title="The Vita Pool"
    allow="fullscreen; clipboard-write; camera; microphone; geolocation"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade"
    frameborder="0"
    scrolling="no"></iframe>

  <script>
    (function () {
      var APP_URL = "https://script.google.com/macros/s/AKfycby1pR8aKVIVbDDDEYR077YDvGv0rTH7SbjiQmbuU2HXx_K9P6x4zxZd23an9n6UfrjTIw/exec";

      var frame  = document.getElementById("app");
      var loader = document.getElementById("loader");
      var done = false;

      function hideLoader() {
        if (done) return;
        done = true;
        loader.classList.add("hide");
        setTimeout(function () { loader.style.display = "none"; }, 700);
      }

      frame.addEventListener("load", hideLoader);

      // กันค้าง: ถ้าโหลดนานเกิน 15 วินาที ให้ซ่อน loader อยู่ดี
      setTimeout(hideLoader, 15000);

      // ส่ง query string (เช่น ?page=xxx) จากโดเมนของเรา ต่อไปให้ Apps Script
      var qs = window.location.search || "";
      var hash = window.location.hash || "";
      frame.src = APP_URL + qs + hash;
    })();
  </script>
</body>
</html>
