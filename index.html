<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD6AE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Vita Pool">
<title>The Vita Pool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8A%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8F0;--head:#FFD6AE;--btn:#E89A62;--ink:#4A3428;--mute:#7A6355;--line:#F2CBA5}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{height:100dvh;font-family:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink)}

/* ---------- iframe เต็มจอ ---------- */
#app{
  position:fixed;top:0;left:0;right:0;bottom:0;
  width:100%;height:100vh;height:100dvh;
  border:0;margin:0;padding:0;display:block;
  background:var(--bg);
  opacity:0;transition:opacity .5s ease;
}
#app.ready{opacity:1}

/* ---------- Loading screen ---------- */
#loader{
  position:fixed;inset:0;z-index:10;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:linear-gradient(180deg,var(--head) 0%,var(--bg) 70%);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  transition:opacity .5s ease,visibility .5s ease;
}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.water{position:relative;width:84px;height:84px;border-radius:50%;overflow:hidden;background:#fff;border:3px solid var(--btn)}
.water::before,.water::after{content:'';position:absolute;left:-50%;width:200%;height:200%;border-radius:42%;top:52%;background:var(--btn);animation:splwave 3.2s linear infinite}
.water::after{top:58%;background:rgba(217,130,73,.55);animation-duration:5s;animation-direction:reverse}
@keyframes splwave{to{transform:rotate(360deg)}}
.brand{font-family:'Baloo 2','Segoe UI',sans-serif;font-weight:700;font-size:34px;letter-spacing:.025em;line-height:1.2;text-align:center}
.hint{font-size:14px;color:var(--mute);min-height:1.5em;text-align:center;padding:0 20px}
noscript{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px;text-align:center}
@media (prefers-reduced-motion:reduce){.water::before,.water::after{animation-duration:12s}}
</style>
</head>
<body>

<div id="loader" role="status" aria-live="polite">
  <div class="water" aria-hidden="true"></div>
  <div class="brand">The Vita Pool</div>
  <div class="hint" id="hint">กำลังโหลด…</div>
</div>

<iframe
  id="app"
  title="The Vita Pool"
  allow="fullscreen"
  allowfullscreen
  scrolling="no"
  frameborder="0"
  referrerpolicy="no-referrer-when-downgrade"></iframe>

<noscript>กรุณาเปิดใช้งาน JavaScript เพื่อใช้งาน The Vita Pool</noscript>

<script>
(function () {
  var URL_ = 'https://script.google.com/macros/s/AKfycby1pR8aKVIVbDDDEYR077YDvGv0rTH7SbjiQmbuU2HXx_K9P6x4zxZd23an9n6UfrjTIw/exec';

  var frame = document.getElementById('app');
  var loader = document.getElementById('loader');
  var hint = document.getElementById('hint');
  var done = false;

  function finish() {
    if (done) return;
    done = true;
    // รอสั้น ๆ ให้หน้าใน Apps Script วาดเสร็จก่อน แล้วค่อย fade
    setTimeout(function () {
      frame.classList.add('ready');
      loader.classList.add('hide');
      setTimeout(function () { loader.style.display = 'none'; }, 600);
    }, 350);
  }

  frame.addEventListener('load', finish);

  // ส่งพารามิเตอร์ใน URL ของเรา (เช่น ?page=x) ต่อให้ Apps Script
  var q = window.location.search || '';
  frame.src = URL_ + q;

  // เน็ตช้า: แจ้งผู้ใช้
  setTimeout(function () {
    if (!done) hint.textContent = 'กำลังเชื่อมต่อ ใช้เวลาสักครู่…';
  }, 6000);

  // กันค้าง: ถ้าเกิน 20 วินาทีให้เอา loading ออกอยู่ดี
  setTimeout(finish, 20000);
})();
</script>
</body>
</html>
