<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TheVitaPool</title>
<meta name="description" content="The Vita Pool - ระบบคูปองว่ายน้ำ">
<meta name="theme-color" content="#FFD6AE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TheVitaPool">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FFD6AE'/%3E%3Cpath d='M8 38c6-6 12-6 18 0s12 6 18 0 8-5 12-2v18H8z' fill='%23E89A62'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet"></noscript>
<style>
  :root {
    --bg: #FFF8F0;          /* สีพื้นของแอป */
    --head: #FFD6AE;        /* สีแถบหัวของแอป (ใช้ทาใต้ notch บนมือถือ) */
    --accent: #E89A62;
    --ink: #4A3428;
    --mute: #7A6355;

    /* ความสูงแถบ "สร้างโดยผู้ใช้ Google Apps Script" ที่ต้องดันออกนอกจอ
       ถ้ายังเห็นแถบเหลืออยู่ให้เพิ่มค่า ถ้าตัดหัวแอปเข้ามาให้ลดค่า */
    --banner-crop: 40px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;       /* หน้าห่อไม่มี scrollbar (แอปข้างในเลื่อนเองได้) */
    background: var(--bg);
    overscroll-behavior: none;
  }

  /* กรอบแอป: เต็มจอ ใช้ dvh กันแถบ address bar มือถือบัง และเว้นพื้นที่ notch / home bar */
  #app {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100vh;          /* fallback เบราว์เซอร์เก่า */
    height: 100dvh;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    overflow: hidden;
    background: var(--bg);
  }

  /* ทาสีแถบหัวใต้ notch ให้กลืนกับหัวแอป */
  #app::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: env(safe-area-inset-top, 0px);
    background: var(--head);
    z-index: 1;
  }

  .viewport {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;       /* ตัดส่วนที่ดันออกนอกกรอบทิ้ง */
  }

  /* เลื่อน iframe ขึ้นเท่าความสูงแถบ Apps Script แล้วขยายความสูงชดเชย */
  iframe#frame {
    position: absolute;
    left: 0;
    top: calc(-1 * var(--banner-crop));
    width: 100%;
    height: calc(100% + var(--banner-crop));
    border: 0;
    margin: 0;
    padding: 0;
    display: block;
    background: var(--bg);
  }

  /* ---------- หน้าโหลด ---------- */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: linear-gradient(180deg, var(--head) 0%, var(--bg) 70%);
    color: var(--ink);
    opacity: 1;
    visibility: visible;
    transition: opacity .5s ease, visibility 0s linear 0s;
  }
  #loader.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .5s ease, visibility 0s linear .5s;
  }

  .name {
    font: 700 34px/1.2 "Baloo 2", "Segoe UI", "Noto Sans Thai", system-ui, sans-serif;
    letter-spacing: .02em;
  }

  /* คลื่นน้ำในวงกลม: เหมือน splash เดิมของแอป */
  .water {
    position: relative;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    overflow: hidden;
    background: #fff;
    border: 3px solid var(--accent);
  }
  .water::before, .water::after {
    content: "";
    position: absolute;
    left: -50%;
    width: 200%;
    height: 200%;
    border-radius: 42%;
    top: 52%;
    background: var(--accent);
    animation: wave 3.2s linear infinite;
  }
  .water::after {
    top: 58%;
    background: rgba(217, 130, 73, .55);
    animation-duration: 5s;
    animation-direction: reverse;
  }
  @keyframes wave { to { transform: rotate(360deg); } }

  .hint {
    min-height: 1.5em;
    margin: 0;
    font: 400 14px/1.5 "Noto Sans Thai", system-ui, sans-serif;
    color: var(--mute);
    text-align: center;
    padding: 0 24px;
  }
  .hint button {
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    padding: 8px 16px;
    margin-left: 6px;
    cursor: pointer;
  }
  .hint button:focus-visible { outline: 3px solid rgba(232,154,98,.4); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    #loader, #loader.hide { transition: none; }
    .water::before, .water::after { animation-duration: 12s; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="viewport">
    <iframe
      id="frame"
      title="TheVitaPool"
      src="https://script.google.com/macros/s/AKfycby1pR8aKVIVbDDDEYR077YDvGv0rTH7SbjiQmbuU2HXx_K9P6x4zxZd23an9n6UfrjTIw/exec"
      allow="fullscreen"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </div>
</div>

<div id="loader" role="status" aria-live="polite">
  <div class="water" aria-hidden="true"></div>
  <div class="name">The Vita Pool</div>
  <p class="hint" id="hint">กำลังโหลด…</p>
</div>

<noscript>
  <style>#loader { display: none; }</style>
  <p style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;margin:0;padding:24px;text-align:center;font:16px system-ui,sans-serif;color:#4A3428">
    กรุณาเปิดใช้งาน JavaScript เพื่อใช้ระบบ TheVitaPool
  </p>
</noscript>

<script>
(function () {
  var frame  = document.getElementById('frame');
  var loader = document.getElementById('loader');
  var hint   = document.getElementById('hint');
  var SLOW_MS = 15000;
  var done = false, slowTimer;

  function finish() {
    if (done) return;
    done = true;
    clearTimeout(slowTimer);
    loader.classList.add('hide');                       // fade out
    setTimeout(function () { loader.style.display = 'none'; }, 600);
  }

  // โหลดช้ากว่าปกติ: แจ้งผู้ใช้และมีปุ่มลองใหม่ (หน้าโหลดยังอยู่จนกว่า iframe จะโหลดเสร็จ)
  function armSlowNotice() {
    clearTimeout(slowTimer);
    slowTimer = setTimeout(function () {
      if (done) return;
      hint.innerHTML = 'โหลดนานกว่าปกติ <button type="button" id="retry">ลองใหม่</button>';
      document.getElementById('retry').addEventListener('click', retry);
    }, SLOW_MS);
  }

  function retry() {
    var src = frame.getAttribute('src');
    hint.textContent = 'กำลังโหลด…';
    frame.setAttribute('src', 'about:blank');
    setTimeout(function () { frame.setAttribute('src', src); }, 50);
    armSlowNotice();
  }

  // iframe โหลดเสร็จ -> fade out หน้าโหลด (ข้าม about:blank ตอนกดลองใหม่)
  frame.addEventListener('load', function () {
    if (frame.getAttribute('src') === 'about:blank') return;
    finish();
  });

  armSlowNotice();
})();
</script>
</body>
</html>
