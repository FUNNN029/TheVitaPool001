<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Vita Pool</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8F0;--head:#FFD6AE;--card:#FFE9D2;--btn:#E89A62;--btn2:#D98249;--ink:#4A3428;--mute:#7A6355;--line:#F2CBA5;
--ok:#DCEBDD;--warn:#F8EDC5;--bad:#F1D6D2;--done:#E4E1DE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Noto Sans Thai',system-ui,sans-serif}
header{background:var(--head);color:var(--ink);padding:22px 16px 18px;text-align:center;border-bottom:3px solid var(--line)}
header h1{margin:0;font-family:'Baloo 2','Segoe UI',sans-serif;font-size:34px;font-weight:700;letter-spacing:.025em;line-height:1.25}
header p{margin:3px 0 0;font-size:14px;color:var(--mute)}
main{max-width:680px;margin:0 auto;padding:20px 14px 80px}
.wide{max-width:1240px}
h2{font-size:18px;margin:18px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(29,45,38,.045)}
label.f{display:block;font-weight:600;margin:10px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus,select:focus,button:focus-visible{outline:3px solid rgba(217,130,73,.28);outline-offset:1px}
button{font:inherit;font-weight:600;color:var(--ink);background:var(--btn);border:1px solid var(--btn);border-radius:10px;padding:12px 16px;cursor:pointer;transition:background .16s,border-color .16s,transform .16s}
button:hover{background:#E39962;border-color:#E39962}button:active{transform:translateY(1px);background:var(--btn2)}
button.full{width:100%;margin-top:14px;font-size:17px}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.sm{padding:7px 12px;font-size:14px;border-radius:9px}
button.danger{background:#F1E0DD;color:#743F39;border-color:#E4C6C2}
button:disabled{opacity:.5}
.btn-spinner{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:7px;animation:btnspin .7s linear infinite}
@keyframes btnspin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;background:#fff;color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--btn);color:var(--ink);border-color:var(--btn)}
.admin-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}
.admin-side{position:sticky;top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.admin-nav{display:grid;gap:6px}.admin-nav button{width:100%;text-align:left;background:#fff;border:1px solid transparent;padding:9px 11px}
.admin-nav button.on{background:var(--btn);border-color:var(--btn);font-weight:700}
.admin-main{min-width:0}.admin-meta{text-align:right;margin:0 0 8px}
@media(max-width:760px){.admin-layout{grid-template-columns:1fr;gap:10px}.admin-side{position:static;padding:8px}.admin-nav{display:flex;overflow-x:auto}.admin-nav button{flex:none;width:auto;white-space:nowrap}.admin-meta{text-align:left}.batch-slot{grid-template-columns:92px minmax(0,1fr)}.batch-slot>select{grid-column:2}}
.pkg{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.pkg input{width:20px;height:20px;accent-color:#D98249;flex:none}
.pkg.sel{border-color:#E89A62;background:#FFF3E6}
.pkg b{display:block}.pkg small{color:var(--mute)}
.pkg .pr{margin-left:auto;font-weight:700;white-space:nowrap}
.pay{display:flex;gap:8px}.pay .pkg{flex:1;margin:0;justify-content:center}
.info{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:15px}
.info dt{color:var(--mute)}.info dd{margin:0;font-weight:600}
.bar{height:12px;background:#fff;border-radius:8px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--btn2)}
.alert{border-radius:12px;padding:12px 14px;font-weight:700;text-align:center;margin-bottom:12px}
.alert.bad{background:var(--bad)}.alert.done{background:var(--done)}.alert.warn{background:var(--warn)}
.slot{border-radius:14px;padding:12px 14px;margin-bottom:10px;border:2px dashed var(--line);background:#fff}
.slot.used{background:#D9F0DB;border:2px solid #A9D9AE}
.slot .top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:700}
.c-ok{background:var(--ok)}.c-warn{background:var(--warn)}.c-bad{background:var(--bad)}.c-done{background:var(--done)}
.cu{border-left:5px solid}.cu.s-ok{border-color:#7AA982}.cu.s-warn{border-color:#D5AF57}.cu.s-bad{border-color:#C47D73}.cu.s-done{border-color:#A9A39C}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px}
.muted{color:var(--mute);font-size:14px}
.link{background:none;color:var(--mute);text-decoration:underline;padding:6px;font-weight:400;font-size:14px}
.tb{width:100%;border-collapse:collapse;font-size:15px;background:#fff;border-radius:10px}.tb th,.tb td{padding:8px;border-bottom:1px solid var(--line);text-align:right}.tb th:first-child,.tb td:first-child{text-align:left}.tb th{background:var(--card);font-weight:600}
#doc{display:none}
.pd{font:13px/1.5 'Noto Sans Thai',sans-serif;color:#000}.pd h1{margin:0;text-align:center;font-size:22px}.pd h2{margin:2px 0 4px;text-align:center;font-size:15px;font-weight:600}.pd h3{margin:14px 0 6px;font-size:14px}.pd .r{text-align:right;margin:0;font-size:12px}.pd .tb th{background:#eee}.dv{background:#FFD6AE;border-radius:8px;padding:5px 10px;font-weight:700;font-size:14px;margin:12px 0 6px}.he{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}details.hc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}details.hc summary{cursor:pointer;list-style:none}details.hc[open] summary{margin-bottom:6px}
details.coupon-set{cursor:default}details.coupon-set>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:2px 0}details.coupon-set>summary::-webkit-details-marker{display:none}details.coupon-set>summary::after{content:'▾';margin-left:auto;color:var(--mute);font-size:18px}details.coupon-set[open]>summary::after{content:'▴'}details.coupon-set[open]>summary{margin-bottom:8px}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}.stp{display:flex;gap:6px;align-items:center}.stp input{width:68px;text-align:center}.stp button{width:42px;padding:9px 0}
.batch-slot{display:grid;grid-template-columns:100px minmax(0,1.2fr) minmax(0,.9fr) minmax(0,.9fr);gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.batch-slot label{display:flex;align-items:center;gap:7px;white-space:nowrap}.batch-slot input[type=checkbox]{width:20px;height:20px;flex:none}.batch-slot input:disabled{background:#f3eee8;color:var(--mute)}
h3{font-size:16px;margin:16px 0 8px}.pd .card{background:#fff;border:1px solid #bbb}.pd .sig{display:flex;justify-content:space-around;margin-top:48px;text-align:center}
@page{size:A4;margin:14mm}
@media print{body.printing header,body.printing main,body.printing #toast,body.printing #modal{display:none!important}body.printing #doc{display:block}body.printing{background:#fff}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;display:none;z-index:10;max-width:90%;text-align:center}
#modal{position:fixed;inset:0;background:rgba(74,52,40,.45);display:none;align-items:center;justify-content:center;z-index:11;padding:20px}
#modal.on{display:flex}
#modal div{background:var(--bg);border-radius:16px;padding:20px;max-width:360px;width:100%}
#modal p{margin:0 0 16px;font-weight:600}
@media(prefers-reduced-motion:no-preference){.alert{animation:pop .3s}@keyframes pop{from{transform:scale(.96);opacity:0}}}
html{height:100%}
body{min-height:100vh;min-height:100dvh}
header{padding-top:calc(22px + env(safe-area-inset-top,0px))}
main{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
#splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:linear-gradient(180deg,var(--head) 0%,var(--bg) 70%);transition:opacity .5s ease,visibility 0s linear .5s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .water{position:relative;width:84px;height:84px;border-radius:50%;overflow:hidden;background:#fff;border:3px solid var(--btn)}
#splash .water::before,#splash .water::after{content:'';position:absolute;left:-50%;width:200%;height:200%;border-radius:42%;top:52%;background:var(--btn);animation:splwave 3.2s linear infinite}
#splash .water::after{top:58%;background:rgba(217,130,73,.55);animation-duration:5s;animation-direction:reverse}
@keyframes splwave{to{transform:rotate(360deg)}}
#splash b{font-family:'Baloo 2','Segoe UI',sans-serif;font-size:34px;letter-spacing:.025em;line-height:1.2}
@media(prefers-reduced-motion:reduce){#splash .water::before,#splash .water::after{animation-duration:12s}}
@media print{#splash{display:none!important}}
header h1{display:flex;align-items:center;justify-content:center;gap:10px}
header h1 img{height:56px;width:auto;margin:-8px 0;flex:none}
</style>
</head>

<main id="app"></main>
<div id="toast"></div>
<div id="doc"></div>
<div id="modal"><div><p id="mq"></p><div class="row"><button id="mn" class="ghost">ยกเลิก</button><button id="my">ยืนยัน</button></div></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\uFE0F\u200D]/gu, '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht = n => Number(n).toLocaleString('th-TH');
const fd = s => { if (!s) return '-'; const p = s.slice(0,10).split('-'); return p.length < 3 ? s : `${p[2]}/${p[1]}/${+p[0]+543}`; };
const ft = s => s ? fd(s) + ' ' + s.slice(11,16) + ' น.' : '-';
const call = (fn, ...a) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a));
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} }, del(k){ try{localStorage.removeItem(k)}catch(e){} } };
const adminSession = { get(k){ try{return sessionStorage.getItem('vp_admin_'+k)}catch(e){return null} }, set(k,v){ try{sessionStorage.setItem('vp_admin_'+k,v)}catch(e){} }, del(k){ try{sessionStorage.removeItem('vp_admin_'+k)}catch(e){} }, clear(){ this.del('token'); this.del('atab'); } };
let pendingActionButton = null;
document.addEventListener('click', e => {
  if (e.target.closest('#modal')) return;
  const b = e.target.closest('button');
  if (b) {
    pendingActionButton = b;
    setTimeout(() => { if (pendingActionButton === b && !$('#modal').classList.contains('on')) pendingActionButton = null; }, 1200);
  }
}, true);
function beginButtonBusy(button){
  if (!button || !button.isConnected || button.disabled) return null;
  const state = {html:button.innerHTML, disabled:button.disabled};
  button.disabled = true;
  button.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span>กำลังทำงาน…';
  return state;
}
function endButtonBusy(button, state){
  if (button && state && button.isConnected) { button.innerHTML = state.html; button.disabled = state.disabled; }
}

let S = { pkgs: [], teachers: [], coupon: null, tab: 'reg', pkg: '', pay: '', adm: null, pw: '', staff: null, sales: [], atab: 'cus', loadingTab: '', f: {}, ac: null, edit: '', rm: '', rv: 'day', rd: '', dailyV: null, dailyH: null, teacherMonth: '', teaView: 'list', hv: 'cus', hq: '', hopen: {}, vdate: '', vdata: null, vlast: null, vpay: '', vedit: null, vemethod: '', hdate: '', hdata: null, hlast: null, hedit: null, list: [], renewing: false, rp: '', rpay: '', adminRevision: '', batchUi: {key:'',open:false,slots:{}} };

function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',3500); }
function ask(q){ return new Promise(r=>{ $('#mq').textContent=q; $('#modal').classList.add('on');
  $('#my').onclick=()=>{$('#modal').classList.remove('on');r(true)}; $('#mn').onclick=()=>{$('#modal').classList.remove('on');pendingActionButton=null;r(false)}; }); }
async function run(fn, ...a){
  const button = pendingActionButton; pendingActionButton = null;
  const busyState = beginButtonBusy(button);
  try { const r = await call(fn, ...a); if (r && r.revision) S.adminRevision = r.revision; return r; }
  catch(e){ toast('เชื่อมต่อไม่สำเร็จ กรุณาลองใหม่'); return null; }
  finally { endButtonBusy(button, busyState); }
}
async function refreshNow(button){
  const state = beginButtonBusy(button);
  try { await poll(true); } finally { endButtonBusy(button, state); }
}
const stCls = s => ({'ใช้งานได้':'ok','ใกล้หมดอายุ':'warn','หมดอายุ':'bad','ใช้ครบแล้ว':'done'}[s] || 'ok');
const stIcon = s => '';
const TEAM_ORDER = ['ทีมครูเปรม','ทีมครูเบน','ทีมครูโจ้ก','ทีมครูนะ','ทีมครูจั้ม'];
const sortTeams = teams => [...new Set(teams)].sort((a, b) => {
  const ai = TEAM_ORDER.indexOf(a), bi = TEAM_ORDER.indexOf(b);
  if (ai >= 0 || bi >= 0) return ai < 0 ? 1 : bi < 0 ? -1 : ai - bi;
  return a.localeCompare(b, 'th');
});

/* ================= เริ่มต้น ================= */
async function boot(){
  const d = await run('getInit');
  if (d) { S.pkgs = d.packages; S.teachers = d.teachers; }
  try { S.list = JSON.parse(store.get('vp_list') || '[]'); } catch (e) { S.list = []; }
  const adminToken = adminSession.get('token');
  if (adminToken) {
    S.tab = 'adm'; S.atab = adminSession.get('atab') || 'cus'; S.pw = adminToken;
    const a = await run('adminLogin', adminToken, '', S.atab);
    if (a && a.ok) { S.adm = a.data; S.pw = a.token || adminToken; S.staff = a.staff; S.adminRevision = a.revision || ''; if (S.staff && S.staff.role !== 'owner' && ['staff','tea','pkg'].includes(S.atab)) S.atab = 'cus'; }
    else { adminSession.del('token'); S.tab = 'adm'; S.pw = ''; }
  }
  if (!S.adm) {
    const saved = store.get('vp_id'), tk = store.get('vp_tk');
    if (saved && tk) { const r = await run('getCoupon', saved, tk); if (r && r.ok) { S.coupon = r.coupon; } else { store.del('vp_id'); store.del('vp_tk'); S.tab = 'find'; } }
  }
  render();
}
function render(){
  const m = $('#app');

  renderHome();
  window.scrollTo(0,0);
}

async function doReg(){
  const f = { name: $('#n').value, phone: $('#p').value, pkg: S.pkg, payment: S.pay, password: $('#pw1').value };
  if (!f.name.trim()) return toast('กรุณากรอกชื่อผู้ปกครอง');
  if (f.phone.replace(/\D/g,'').length < 9) return toast('กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง');
  if (f.password.length < 4) return toast('รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร');
  if (f.password !== $('#pw2').value) return toast('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
  if (!f.pkg) return toast('กรุณาเลือกแพ็กเกจ');

}
async function saveChildName(){
  const c = S.ac || S.coupon, name = $('#kidName').value.trim();
  if (!name) return toast('กรุณากรอกชื่อ');
  const r = S.ac ? await run('adminSaveChild', S.pw, c.id, name) : await run('customerSaveChild', c.id, store.get('vp_tk'), name);
  if (!r) return;
  if (!r.ok) return toast(r.msg);
  if (S.ac) { S.adm = r.data; S.ac.children = r.extra; } else S.coupon.children = r.children;
  renderCoupon(); toast('บันทึกรายชื่อแล้ว');
}
async function deleteChildName(name){
  if (!await ask('นำชื่อนี้ออกจากรายการที่บันทึกไว้? ประวัติการใช้เดิมจะยังอยู่')) return;
  const c = S.ac || S.coupon;
  const r = S.ac ? await run('adminDeleteChild', S.pw, c.id, name) : await run('customerDeleteChild', c.id, store.get('vp_tk'), name);
  if (!r) return;
  if (!r.ok) return toast(r.msg);
  if (S.ac) { S.adm = r.data; S.ac.children = r.extra; } else S.coupon.children = r.children;
  renderCoupon(); toast('ลบชื่อออกจากรายการแล้ว');
}
function fillT(n){
  const t = $('#tm'+n).value, sel = $('#tc'+n);
  sel.innerHTML = '<option value="">เลือกชื่อครู</option>' + (S.ac ? S.adm.teachers : S.teachers).filter(x => x.team === t).map(x => `<option>${esc(x.name)}</option>`).join('');
}
function fillBatchTeachersForSlot(n){
  const t = $('#batchTeam' + n).value, sel = $('#batchTeacher' + n);
  sel.innerHTML = '<option value="">เลือกชื่อครู</option>' + (S.ac ? S.adm.teachers : S.teachers).filter(x => x.team === t).map(x => `<option>${esc(x.name)}</option>`).join('');
  sel.disabled = !t;
  rememberBatchSlot(n);

function rememberBatchOpen(open){ if (S.batchUi) S.batchUi.open = !!open; }
function rememberBatchSlot(n){
  if (!S.batchUi) return;
  const check = $('#batchSlot' + n), child = $('#batchChild' + n), team = $('#batchTeam' + n), teacher = $('#batchTeacher' + n);
  if (check && child && team && teacher) S.batchUi.slots[n] = {checked:check.checked,child:child.value,team:team.value,teacher:teacher.value};
}
function toggleBatchSlot(n){
  const checked = $('#batchSlot' + n).checked, input = $('#batchChild' + n), team = $('#batchTeam' + n), teacher = $('#batchTeacher' + n);
  input.disabled = !checked; team.disabled = !checked; teacher.disabled = !checked || !team.value;
  if (!checked) { input.value = ''; team.value = ''; teacher.innerHTML = '<option value="">เลือกชื่อครู</option>'; }

async function saveBatchUse(){
  const c = S.ac || S.coupon;
  const entries = c.slots.filter(s => !s.used && $('#batchSlot' + s.no) && $('#batchSlot' + s.no).checked)
    .map(s => ({ slot: s.no, child: $('#batchChild' + s.no).value.trim(), team: $('#batchTeam' + s.no).value, teacher: $('#batchTeacher' + s.no).value }));
  if (entries.length < 2) return toast('กรุณาเลือกอย่างน้อย 2 คน');
  if (entries.some(x => !x.child)) return toast('กรุณากรอกชื่อเด็กให้ครบทุกช่อง');
  if (entries.some(x => !x.team || !x.teacher)) return toast('กรุณาเลือกทีมและครูให้ครบทุกคน');
  const detail = entries.map(x => `${x.child} (${x.team}/${x.teacher})`).join(', ');
  if (!await ask(`ยืนยันบันทึก ${entries.length} คน ใช้คูปอง ${entries.length} ช่อง?\n${detail}`)) return;
  if (S.ac) {
    const r = await actX('adminUseSlotsBatch', S.ac.id, entries, S.ac.set);
    if (r) { S.ac = r.extra; renderCoupon(); toast(`บันทึกการใช้งาน ${entries.length} คนแล้ว`); }
    return;
  }
  const r = await run('useSlotsBatch', S.coupon.id, store.get('vp_tk'), entries, S.coupon.set);
  if (!r) return;
  if (!r.ok) { toast(r.msg); const g = await run('getCoupon', S.coupon.id, store.get('vp_tk'), S.coupon.set); if (g && g.ok) { S.coupon = g.coupon; render(); } else leave(); return; }
  S.coupon = r.coupon; render(); toast(`บันทึกการใช้งาน ${entries.length} คนแล้ว`);
}
async function useSlot(n){
  const child = $('#ch'+n).value.trim(), team = $('#tm'+n).value, th = $('#tc'+n).value;

  if (!th) return toast('กรุณาเลือกชื่อครู');
  if (!await ask(`บันทึกช่องที่ ${n} ให้ "${child}" ?\nบันทึกแล้วจะแก้ไขเองไม่ได้`)) return;
  if (S.ac) {

const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const fm = k => { const p = k.split('-'); return `${TH_M[+p[1]-1]} ${+p[0]+543}`; };
const p2 = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate()); };
const sumP = l => l.reduce((t, c) => t + c.price, 0);
const byMethod = (l, m) => sumP(l.filter(c => c.method === m));

// ตารางยอดขาย: แยกวัน (เฉพาะรายเดือน) + แยกแพ็กเกจ โดยแต่ละบรรทัดแยก เงินสด / เงินโอน
function salesHtml(list, withDays){
  const isPaid = c => c.paid === 'ชำระแล้ว';
  const head = f => `<tr><th>${f}</th><th>จำนวน</th><th>เงินสด (บาท)</th><th>เงินโอน (บาท)</th><th>รวม (บาท)</th></tr>`;
  const row = (label, l, b) => `<tr><td>${b ? '<b>' : ''}${esc(label)}${b ? '</b>' : ''}</td><td>${l.length}</td><td>${baht(byMethod(l,'เงินสด'))}</td><td>${baht(byMethod(l,'เงินโอน'))}</td><td>${b ? '<b>' : ''}${baht(sumP(l))}${b ? '</b>' : ''}</td></tr>`;
  const grp = kf => { const m = {}; list.forEach(c => { (m[kf(c)] = m[kf(c)] || []).push(c); }); return m; };
  const tbl = (first, m, lab, byN) => {
    const keys = Object.keys(m).sort((x, y) => byN ? m[y].length - m[x].length : (x < y ? -1 : 1));
    return `<div style="overflow-x:auto"><table class="tb">${head(first)}${keys.map(k => row(lab(k), m[k])).join('') || '<tr><td colspan="5" class="muted">ไม่มีการขาย</td></tr>'}${row('รวม', list, true)}</table></div>`;
  };
  return `<div class="card"><dl class="info"><dt>ขายได้</dt><dd>${list.length} ชุด</dd>
  <dt>รวมยอดทั้งหมด</dt><dd>${baht(sumP(list))} บาท</dd><dt>เงินสด</dt><dd>${baht(byMethod(list,'เงินสด'))} บาท</dd><dt>เงินโอน</dt><dd>${baht(byMethod(list,'เงินโอน'))} บาท</dd>
  <dt>รับเงินแล้ว</dt><dd>${baht(sumP(list.filter(isPaid)))} บาท</dd><dt>ค้างชำระ/รอตรวจสอบ</dt><dd>${baht(sumP(list.filter(c => !isPaid(c))))} บาท</dd></dl></div>
  ${withDays ? `<h3>แยกตามวัน</h3>${tbl('วันที่', grp(c => c.buy), fd, false)}` : ''}
  <h3>แยกตามแพ็กเกจ</h3>${tbl('แพ็กเกจ', grp(c => c.pkg), x => x, true)}`;
}

// รายงานผลงานครูรายเดือน: แสดงรายคนภายในทีม และไม่นับรายการยกเลิก
function teacherMonthlyHtml(month){
  const hs = S.adm.history.filter(x => x.st === 'ใช้งาน' && x.time.slice(0,7) === month);
  const groups = {};
  const add = (team, name) => {
    if (!team || !name) return;
    groups[team] = groups[team] || new Set();
    groups[team].add(name);
  };
  S.adm.teachers.forEach(t => add(t.team, t.name));
  hs.forEach(x => add(x.team, x.teacher));
  const teams = sortTeams(Object.keys(groups));
  if (!teams.length) return '<p class="muted">ยังไม่มีข้อมูลครู</p>';
  const count = (team, name) => hs.filter(x => x.team === team && x.teacher === name).length;
  const rows = teams.map(team => {
    const names = [...groups[team]].sort();
    const total = hs.filter(x => x.team === team).length;
    return `<tr><td colspan="2" style="text-align:left;background:var(--card)"><b>${esc(team)}</b></td></tr>
      ${names.map(name => `<tr><td style="text-align:left;padding-left:24px">${esc(name)}</td><td>${count(team, name)}</td></tr>`).join('')}
      <tr><td style="text-align:left"><b>รวมทีม</b></td><td><b>${total}</b></td></tr>`;
  }).join('');
  return `<div style="overflow-x:auto"><table class="tb"><tr><th style="text-align:left">ทีม / ชื่อครู</th><th>จำนวนคน-ครั้ง</th></tr>${rows}
    <tr><td style="text-align:left"><b>รวมทุกทีม</b></td><td><b>${hs.length}</b></td></tr></table></div>
    <p class="muted">นับ 1 รายการใช้คูปองที่บันทึก = 1 คน-ครั้ง และไม่นับรายการที่ยกเลิก</p>`;
}

const TH_MF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

const fdtFull = t => { if (!t) return '-'; const d = t.slice(0,10).split('-'); return `${+d[2]} ${TH_MF[+d[1]-1]} ${+d[0]+543} เวลา ${t.slice(11,16)} น.`; };
function visLines(c, P){
  const E = [['child','เด็ก','คน'],['adult','ผู้ใหญ่','คน'],['senior','ผู้สูงวัย','คน']], Q = [['shirt','เสื้อ'],['trunks','กางเกง'],['goggles','แว่นตา'],['cap','หมวก']];
  let entry = 0, equip = 0; const ep = [], qp = [];
  E.forEach(e => { const n = c[e[0]]; if (n > 0) { const a = n * P[e[0]]; entry += a; ep.push(`${e[1]} ${n} ${e[2]} (${a})`); } });
  Q.forEach(e => { const n = c[e[0]]; if (n > 0) { const a = n * P[e[0]]; equip += a; qp.push(`${e[1]} ${n} (${a})`); } });
  return { entry, equip, total: entry + equip, entryTxt: ep.length ? ep.join(' + ') + ` = ${entry} บาท` : '-', equipTxt: qp.length ? qp.join(' + ') + ` = ${equip} บาท` : '-' };
}

function hotEditPanel(v){
  return `<div class="card" style="background:#FFF8F0;margin:10px 0 0"><b> แก้ไขรายการ</b>
  <label class="f" for="he_room">เลขห้องพัก</label><input id="he_room" value="${esc(v.room)}" autocomplete="off" oninput="calcHE()">
  ${hotRows(S.hdata.prices, 'he_', true)}<div class="card" style="background:#fff;margin:10px 0 0" id="heprev"></div>
  <div class="row" style="margin-top:10px"><button class="sm" style="flex:none" onclick="saveHEdit()"> บันทึก</button><button class="sm ghost" style="flex:none" onclick="closeHEdit()">ปิด</button></div></div>`;
}
function calcHE(){
  if (!$('#heprev') || S.hedit == null) return;
  $('#heprev').innerHTML = hotFull(hotVal(readH('he_'), S.hdata.prices, (S.hdata.day.find(x => x.row === S.hedit) || {}).time, $('#he_room').value.trim()));
}
function startHEdit(row){
  const v = S.hdata.day.find(x => x.row === row); if (!v) return;
  S.hedit = row; admHotList();
  ['adults','children', ...HEQ].forEach(k => { $('#he_' + k).value = v[k]; }); calcHE();
}
function closeHEdit(){ S.hedit = null; admHotList(); }
async function saveHEdit(){
  const room = $('#he_room').value.trim(), c = readH('he_');
  if (!room) return toast('กรุณากรอกเลขห้องพัก');
  if (c.adults + c.children <= 0) return toast('กรุณาระบุจำนวนผู้ใหญ่หรือเด็กอย่างน้อย 1 คน');
  const r = await run('adminEditHotel', S.pw, S.hedit, room, c.adults, c.children, c, S.hdate); if (!r) return;
  if (!r.ok) return toast(r.msg);
  S.hdata = r.data; S.hedit = null; S.hlast = null; renderHot(); toast('แก้ไขรายการแล้ว');
}
async function cancelHot(row){
  if (!await ask('ยกเลิกรายการนี้? ยอดจะไม่ถูกนับ (แถวยังอยู่ในชีท)')) return;
  const r = await run('adminCancelHotel', S.pw, row, S.hdate); if (!r) return;
  if (!r.ok) return toast(r.msg);
  S.hdata = r.data; if (S.hlast && S.hlast.row === row) S.hlast = null; renderHot(); toast('ยกเลิกรายการแล้ว');
}
function admHotList(){
  const d = S.hdata;
  $('#hlist').innerHTML = `<div class="card"><label class="f" style="margin-top:0" for="fqhdate">ดูรายการของวันที่</label>
  <input id="fqhdate" type="date" value="${esc(d.date)}" onchange="setHDate(this.value)"></div>
  <h3>รายการแขกโรงแรมวันที่ ${fdFull(d.date)}</h3>${d.day.slice().reverse().map(hotCard).join('') || '<p class="muted">ยังไม่มีรายการในวันนี้</p>'}
  <h2> สรุปรายเดือน — ${fm(d.date.slice(0,7))}</h2>${hotMonthTable(d)}
  <button class="full" onclick="printHotMonth()"> บันทึก / พิมพ์ PDF สรุปรายวันทั้งเดือน</button>
  <p class="muted">ราคาอุปกรณ์ใช้ตารางเดียวกับเข้าใช้รายครั้ง (แท็บ "ตั้งค่าระบบ" คอลัมน์ K:L) • ถ้ากด "แก้ไข" ระบบจะคำนวณใหม่ด้วยราคาปัจจุบัน • รายการที่ยกเลิกไม่ถูกนับในยอด</p>`;
}
async function setHDate(v){
  S.hdate = v || todayStr();
  const r = await run('adminHotels', S.pw, S.hdate); if (!r) return;
  if (!r.ok) return toast(r.msg);
  S.hdata = r.data; S.hedit = null; admHotList();
}
function printHotDay(){
  const d = S.hdata, ok = d.day.filter(v => v.st !== 'ยกเลิก'), L = 'style="text-align:left"';
  doPrint(`<div class="pd"><h1>The Vita Pool</h1><h2>สรุปแขกโรงแรมเข้าใช้สระว่ายน้ำ + เช่าอุปกรณ์ — ประจำวันที่ ${fdFull(d.date)}</h2><p class="r">${printedAt()}</p>
  <h3>สรุปยอด</h3>${hotSumHtml(hotSum(ok))}
  <h3>รายการทั้งหมด (${ok.length} รายการ)</h3><table class="tb"><tr><th ${L}>เวลา</th><th ${L}>ห้อง</th><th>ผู้ใหญ่</th><th>เด็ก</th><th>เสื้อ</th><th>กางเกง</th><th>แว่นตา</th><th>หมวก</th><th>ค่าอุปกรณ์ (บาท)</th></tr>
  ${ok.map(v => `<tr><td ${L}>${v.time.slice(11,16)}</td><td ${L}>${esc(v.room)}</td><td>${v.adults}</td><td>${v.children}</td><td>${v.shirt}</td><td>${v.trunks}</td><td>${v.goggles}</td><td>${v.cap}</td><td>${baht(v.equip)}</td></tr>`).join('') || '<tr><td colspan="9">ไม่มีรายการ</td></tr>'}</table>
  ${sigBlock}</div>`);
}
function printHotMonth(){
  const d = S.hdata;
  doPrint(`<div class="pd"><h1>The Vita Pool</h1><h2>สรุปแขกโรงแรมเข้าใช้สระว่ายน้ำ + เช่าอุปกรณ์ รายวัน — ประจำเดือน ${fm(d.date.slice(0,7))}</h2><p class="r">${printedAt()}</p>${hotMonthTable(d)}${sigBlock}</div>`);
}

/* ================= อัปเดตข้อมูลอัตโนมัติ ================= */
let polling = false, tick = 0, lastPollAt = 0;
const js = JSON.stringify;
// มีข้อความที่พิมพ์ค้างในฟอร์มลงทะเบียน/ฟอร์มหลังบ้านไหม (ถ้ามี จะไม่รีเฟรชทับ)
const dirty = () => [...document.querySelectorAll('#app input')].some(i => !i.id.startsWith('fq') && i.value !== i.defaultValue);
// วาดหน้าใหม่ โดยเก็บสิ่งที่พิมพ์/เลือกค้างในช่องบันทึกการใช้งาน และตำแหน่งเคอร์เซอร์ไว้
function keepForm(draw){
  const keep = {}, ae = document.activeElement, aid = ae && ae.id, pos = ae && ae.selectionStart;
  document.querySelectorAll('#app input[id^=ch], #app select[id^=tm], #app select[id^=tc]').forEach(e => keep[e.id] = e.value);
  draw();
  Object.keys(keep).forEach(id => { const e = $('#' + id); if (e && keep[id] && !id.startsWith('tc')) { e.value = keep[id]; if (id.startsWith('tm')) fillT(+id.slice(2)); } });
  Object.keys(keep).forEach(id => { const e = $('#' + id); if (e && keep[id] && id.startsWith('tc')) e.value = keep[id]; });
  if (aid) { const e = $('#' + aid); if (e) { e.focus({preventScroll:true}); try { if (pos != null) e.setSelectionRange(pos, pos); } catch (x) {} } }
}
function restoreScroll(y){ requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, y))); }
async function poll(force){
  const startedAt = Date.now();
  if (polling || document.hidden || (!force && startedAt - lastPollAt < 4000)) return;
  polling = true; lastPollAt = startedAt;
  const y = window.scrollY;
  try {
    if (S.tab === 'adm' && S.adm) {
      if (S.atab === 'hot' && !S.ac) {   // แท็บแขกโรงแรม: อัปเดตเฉพาะรายการด้านล่าง
        if (!S.hdata) return;
        const rh = await call('adminHotels', S.pw, S.hdate);
        if (!rh || !rh.ok) return;
        if (js(rh.data) !== js(S.hdata)) { S.hdata = rh.data; if (force && $('#hlist') && !S.hedit) { admHotList(); restoreScroll(y); } if (force) toast('อัปเดตข้อมูลแล้ว'); }
        else if (force) toast('ข้อมูลเป็นปัจจุบันแล้ว');
        return;
      }
      if (S.atab === 'vis' && !S.ac) {   // แท็บเข้าใช้รายครั้ง: อัปเดตเฉพาะรายการด้านล่าง ไม่แตะฟอร์มที่กำลังกรอก
        if (!S.vdata) return;
        const rv = await call('adminVisits', S.pw, S.vdate);
        if (!rv || !rv.ok) return;
        if (js(rv.data) !== js(S.vdata)) { S.vdata = rv.data; if (force && $('#vlist') && !S.vedit) { admVisList(); restoreScroll(y); } if (force) toast('อัปเดตข้อมูลแล้ว'); }
        else if (force) toast('ข้อมูลเป็นปัจจุบันแล้ว');
        return;
      }
      if (!S.ac && !force && (S.edit || dirty())) return;
      if (!S.ac && !force) {
        const check = await call('adminRevision', S.pw);
        if (!check || !check.ok) return;
        if (check.revision === S.adminRevision) return;
        S.adminRevision = check.revision;
      }
      const r = S.ac ? await call('adminOpenCoupon', S.pw, S.ac.id, S.ac.set) : await call('adminLogin', S.pw, '', S.atab);
      if (!r || !r.ok) return;
      if (!S.ac && !force && dirty()) return;
      if (js(r.data) === js(S.adm) && (!S.ac || js(r.extra) === js(S.ac))) { if (force) toast('ข้อมูลเป็นปัจจุบันแล้ว'); return; }
      S.adm = r.data; if (S.ac) S.ac = r.extra;
      if (r.revision) S.adminRevision = r.revision;
      if (force) { keepForm(renderAdmin); restoreScroll(y); toast('อัปเดตข้อมูลแล้ว'); }
    } else if (S.coupon) {
      const withInit = tick % 6 === 0;
      const [r, d] = await Promise.all([call('getCoupon', S.coupon.id, store.get('vp_tk'), S.coupon.set), withInit ? call('getInit') : null]);
      if (!r || !r.ok) return;
      let changed = js(r.coupon) !== js(S.coupon);
      if (d) { changed = changed || js(d.teachers) !== js(S.teachers); S.pkgs = d.packages; S.teachers = d.teachers; }
      if (changed) { S.coupon = r.coupon; if (force && !S.renewing) { keepForm(renderCoupon); restoreScroll(y); } if (force) toast('อัปเดตข้อมูลแล้ว'); }
      else if (force) toast('ข้อมูลเป็นปัจจุบันแล้ว');
    } else if (S.tab !== 'adm') {
      const d = await call('getInit');
      if (!d) return;
      S.pkgs = d.packages; S.teachers = d.teachers;
    }
  } catch (e) {} finally { polling = false; }
}
setInterval(() => { tick++; poll(); }, 10000);                 // ทุก 10 วินาที
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
window.addEventListener('focus', () => poll());
window.addEventListener('pageshow', () => poll());
window.addEventListener('online', () => poll());

function hideSplash(){ const s = document.getElementById('splash'); if (!s) return; s.classList.add('hide'); setTimeout(() => s.remove(), 700); }
setTimeout(hideSplash, 15000);   // กันค้าง
boot().finally(hideSplash);
</script>
</body>
</html>
